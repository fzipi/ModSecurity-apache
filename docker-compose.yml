services:
  modsec3-apache:
    build: .
    container_name: modsec3-apache-test
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/var/log/apache2:rw
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
